apiVersion: apps/v1
kind: Deployment
metadata:
  name: reelio-dashboard
  labels:
    app: reelio-dashboard
spec:
  # Desired state: Run 2 replica pods for high availability and zero-downtime rolling updates
  replicas: 2
  
  # Selector: Tells the Deployment controller which Pods belong to this deployment
  selector:
    matchLabels:
      app: reelio-dashboard

  # Strategy: RollingUpdate ensures new pods start and pass health checks BEFORE old pods are terminated
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1        # Max 1 extra pod created above desired replica count during rollout
      maxUnavailable: 0  # 0 pods can be unavailable during update -> zero downtime

  template:
    metadata:
      labels:
        app: reelio-dashboard
    spec:
      containers:
        - name: dashboard
          image: reelio-dashboard:v1
          imagePullPolicy: IfNotPresent # Uses local image in Docker Desktop / Minikube
          
          ports:
            - containerPort: 80
              name: http

          # cgroups resource governance: Prevents memory leaks or runaway CPU from crashing host
          resources:
            requests:
              memory: "16Mi"
              cpu: "20m"
            limits:
              memory: "64Mi"
              cpu: "100m"

          # Liveness Probe: Is the container healthy? (If failing, Kubelet kills and restarts the pod)
          livenessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3

          # Readiness Probe: Is the container ready to receive live user traffic from the Service?
          readinessProbe:
            httpGet:
              path: /index.html
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
