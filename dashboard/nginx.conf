server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression for fast transfer over Wi-Fi
    gzip on;
    gzip_types text/plain text/css application/javascript application/json font/woff2;
    gzip_min_length 256;

    # Aggressive caching for static bundles (hashed / static JS / fonts)
    location ~* \.(?:woff2|js)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # No-cache for index.html so WebView always pulls the latest shell
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Single Page Application fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
