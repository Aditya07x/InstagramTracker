version: 2.1

# ==============================================================================
# CircleCI CI/CD Automation for Reelio
#
# Workflows:
#   1. dashboard-pipeline: Builds Docker image -> Pushes to Container Registry (GHCR/DockerHub)
#   2. android-pipeline: Builds signed Release APK -> Uploads to Firebase App Distribution
# ==============================================================================

executors:
  docker-builder:
    docker:
      - image: cimg/base:2024.01
    resource_class: medium

  android-builder:
    docker:
      - image: cimg/android:2024.01-node
    resource_class: large
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx4096m"
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.workers.max=2 -Dkotlin.compiler.execution.strategy=in-process"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build and Push React Dashboard Docker Image
  # ────────────────────────────────────────────────────────────────────────────
  build-and-push-dashboard:
    executor: docker-builder
    steps:
      - checkout

      # Allocate an isolated remote Docker daemon
      - setup_remote_docker:
          version: default
          docker_layer_caching: true

      - run:
          name: Build Multi-Stage Production Docker Image
          command: |
            echo "Building Reelio Dashboard Docker image (Commit: ${CIRCLE_SHA1})..."
            docker build \
              -t reelio-dashboard:${CIRCLE_SHA1} \
              -t reelio-dashboard:latest \
              -f Dockerfile .

      - run:
          name: Verify Image and Inspect Size
          command: |
            docker images reelio-dashboard:latest

      - run:
          name: Push Docker Image to Container Registry
          command: |
            if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_PASS" ]; then
              echo "Logging in to Docker Hub..."
              echo "$DOCKERHUB_PASS" | docker login -u "$DOCKERHUB_USER" --password-stdin
              
              docker tag reelio-dashboard:${CIRCLE_SHA1} ${DOCKERHUB_USER}/reelio-dashboard:${CIRCLE_SHA1}
              docker tag reelio-dashboard:latest ${DOCKERHUB_USER}/reelio-dashboard:latest
              
              docker push ${DOCKERHUB_USER}/reelio-dashboard:${CIRCLE_SHA1}
              docker push ${DOCKERHUB_USER}/reelio-dashboard:latest
              echo "Successfully pushed to Docker Hub!"
            elif [ -n "$GHCR_USER" ] && [ -n "$GHCR_PAT" ]; then
              echo "Logging in to GitHub Container Registry (GHCR)..."
              echo "$GHCR_PAT" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
              
              docker tag reelio-dashboard:${CIRCLE_SHA1} ghcr.io/${GHCR_USER}/reelio-dashboard:${CIRCLE_SHA1}
              docker tag reelio-dashboard:latest ghcr.io/${GHCR_USER}/reelio-dashboard:latest
              
              docker push ghcr.io/${GHCR_USER}/reelio-dashboard:${CIRCLE_SHA1}
              docker push ghcr.io/${GHCR_USER}/reelio-dashboard:latest
              echo "Successfully pushed to GHCR!"
            else
              echo "NOTE: Container registry credentials (DOCKERHUB_USER or GHCR_USER) not configured in CircleCI Project Settings."
              echo "Image built and verified locally in CI. Add credentials to enable automated pushing."
            fi

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build Signed Release APK & Upload to Firebase App Distribution
  # ────────────────────────────────────────────────────────────────────────────
  build-and-deploy-apk:
    executor: android-builder
    steps:
      - checkout

      # Restore Gradle dependency and build cache
      - restore_cache:
          key: v1-gradle-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "gradle/libs.versions.toml" }}

      - run:
          name: Ensure Build Dependencies for Chaquopy
          command: |
            sudo apt-get update
            sudo apt-get install -y python3-distutils python3-pip python3-venv python3-setuptools

      - run:
          name: Decode Keystore and Secrets
          command: |
            if [ -n "$KEYSTORE_BASE64" ]; then
              echo "Decoding release keystore..."
              echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore
              echo 'export KEYSTORE_PATH="app/release.keystore"' >> "$BASH_ENV"
            else
              echo "No KEYSTORE_BASE64 provided. Gradle will assemble unsigned/debug APK."
            fi

            if [ -n "$FIREBASE_SERVICE_ACCOUNT_BASE64" ]; then
              echo "Decoding Firebase Google Service Account JSON..."
              echo "$FIREBASE_SERVICE_ACCOUNT_BASE64" | base64 -d > firebase_credentials.json
              echo "export GOOGLE_APPLICATION_CREDENTIALS=\"$(pwd)/firebase_credentials.json\"" >> "$BASH_ENV"
            fi

      - run:
          name: Build Signed Release APK
          command: |
            chmod +x gradlew
            ./gradlew app:assembleRelease --stacktrace

      - run:
          name: Upload to Firebase App Distribution
          command: |
            if [ -n "$FIREBASE_SERVICE_ACCOUNT_BASE64" ] || [ -n "$FIREBASE_TOKEN" ]; then
              echo "Uploading Release APK to Firebase App Distribution..."
              ./gradlew app:appDistributionUploadRelease
            else
              echo "Skipping Firebase upload: FIREBASE_SERVICE_ACCOUNT_BASE64 or FIREBASE_TOKEN not set."
            fi

      - save_cache:
          paths:
            - ~/.gradle/caches
            - ~/.gradle/wrapper
          key: v1-gradle-{{ checksum "build.gradle.kts" }}-{{ checksum "app/build.gradle.kts" }}-{{ checksum "gradle/libs.versions.toml" }}

      - store_artifacts:
          path: app/build/outputs/apk/release
          destination: apks/release

# ──────────────────────────────────────────────────────────────────────────────
# WORKFLOWS DEFINITION
# ──────────────────────────────────────────────────────────────────────────────
workflows:
  version: 2

  # Dashboard CI/CD Workflow
  dashboard-workflow:
    jobs:
      - build-and-push-dashboard:
          filters:
            branches:
              only:
                - main
                - master
                - /feature\/.*/

  # Android Release Workflow
  android-workflow:
    jobs:
      - build-and-deploy-apk:
          filters:
            branches:
              only:
                - main
                - master
            tags:
              only:
                - /^v[0-9]+(\.[0-9]+)*$/
